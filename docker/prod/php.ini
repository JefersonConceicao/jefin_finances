; PHP de produção
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
date.timezone = America/Sao_Paulo

; OPcache: o código não muda dentro do container, então não precisa revalidar
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
